<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCKET STORES | Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="container navbar navbar-expand-lg">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="ROCKET STORES home">
          <img class="site-logo auto-image" src="images/logo.png" alt="ROCKET STORES logo" />
          <span>ROCKET STORES</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto me-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          </ul>
          <button class="btn btn-outline-light btn-sm theme-toggle" type="button" aria-label="Toggle theme">
            <i class="bi bi-moon-stars"></i>
          </button>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <section class="card p-4 p-lg-5">
        <p class="eyebrow">Contact</p>
        <h1>Support for the Rocket Stores toolkit.</h1>
        <p class="lead">Reach out for product support, licensing questions, or guidance around the Win11 Maintenance Pro family.</p>
        <form class="row g-3 mt-2">
          <div class="col-md-6">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" type="text" placeholder="Your name" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" placeholder="you@example.com" />
          </div>
          <div class="col-12">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Tell us about your launch..."></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Send inquiry</button>
          </div>
        </form>
      </section>
    </main>

    <script src="js/ui.js"></script>
  </body>
</html>
