<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCKET STORES | Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="container navbar navbar-expand-lg">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="ROCKET STORES home">
          <img class="site-logo auto-image" src="images/logo.png" alt="ROCKET STORES logo" />
          <span>ROCKET STORES</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto me-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
          <button class="btn btn-outline-light btn-sm theme-toggle" type="button" aria-label="Toggle theme">
            <i class="bi bi-moon-stars"></i>
          </button>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <section class="card p-4 mb-4 search-shell">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Search</p>
            <h1>Find your next favorite tool</h1>
          </div>
        </div>
        <form class="row g-3 align-items-end" data-search-form>
          <div class="col-lg-6">
            <label class="form-label" for="searchQuery">Query</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input class="form-control" id="searchQuery" type="search" placeholder="Search by name, tag, or keyword" />
            </div>
          </div>
          <div class="col-md-4 col-lg-3">
            <label class="form-label" for="categoryFilter">Category</label>
            <select class="form-select" id="categoryFilter">
              <option value="All">All categories</option>
            </select>
          </div>
          <div class="col-md-4 col-lg-3">
            <label class="form-label" for="tagFilter">Tag</label>
            <select class="form-select" id="tagFilter">
              <option value="All">All tags</option>
            </select>
          </div>
        </form>
      </section>

      <section id="searchResults" class="app-grid"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/telegram.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
